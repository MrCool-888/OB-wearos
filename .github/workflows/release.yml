name: Build and Release OpenBubbles Wear

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # Ubuntu runners already provide the Android SDK. Avoid setup-android@v3,
      # which installs the retired "tools" package and currently fails.
      - name: Install Android SDK components
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set on this runner"
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager is unavailable"
            exit 1
          fi
          "$SDKMANAGER" "build-tools;35.0.0" "platforms;android-35"

      - name: Restore signing configuration
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_PROPERTIES" ] && [ -n "$RELEASE_KEYSTORE" ]; then
            printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties
            printf '%s' "$RELEASE_KEYSTORE" | base64 -d > release.keystore
            echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
            echo "Signing secrets are absent; build checks run, release publishing is disabled."
          fi

      - name: Run tests
        run: ./gradlew :protocol:test :phone:testDebugUnitTest :wear:testDebugUnitTest

      - name: Build release APKs
        run: ./gradlew :phone:assembleRelease :wear:assembleRelease

      - name: Build Morphe patch and installable APK set
        env:
          MORPHE_JAVA: ${{ secrets.MORPHE_JAVA_PATH }}
          WORK_BASE_APK: ${{ secrets.WORK_BASE_APK }}
          WORK_ARM64_SPLIT: ${{ secrets.WORK_ARM64_SPLIT }}
          WORK_XAPK: ${{ secrets.WORK_XAPK }}
          WORK_CLASSES_V52: ${{ secrets.WORK_CLASSES_V52 }}
        run: |
          if [ -z "$WORK_BASE_APK" ] || [ -z "$WORK_ARM64_SPLIT" ] || [ -z "$WORK_XAPK" ]; then
            echo "Skipping Morphe patch: WORK_BASE_APK, WORK_ARM64_SPLIT, and WORK_XAPK secrets are required."
            exit 0
          fi

          # Restore local OpenBubbles 2.0.0 inputs (gitignored, not in repo)
          mkdir -p work
          printf '%s' "$WORK_BASE_APK" | base64 -d > work/com.openbubbles.messaging.apk
          printf '%s' "$WORK_ARM64_SPLIT" | base64 -d > work/config.arm64_v8a.apk
          printf '%s' "$WORK_XAPK" | base64 -d > OpenBubbles_2.0.0_APKPure.xapk

          if [ -n "$WORK_CLASSES_V52" ]; then
            printf '%s' "$WORK_CLASSES_V52" | base64 -d > work/openbubbles-classes-v52.jar
          fi

          # JDK 21+ is required for the Morphe Desktop CLI launcher
          MORPHE_JAVA_DIR="${MORPHE_JAVA:-/usr/lib/jvm/temurin-21-jdk-amd64}"
          if [ ! -d "$MORPHE_JAVA_DIR" ]; then
            echo "Installing JDK 21 for Morphe CLI..."
            sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-21-jdk-headless >/dev/null 2>&1
            MORPHE_JAVA_DIR="/usr/lib/jvm/java-21-openjdk-amd64"
          fi

          ./gradlew -p morphe packageInstallableApks verifyInstallableApks -PmorpheJava="$MORPHE_JAVA_DIR"

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp phone/build/outputs/apk/release/phone-release.apk release-assets/OpenBubblesWear-Phone-2.1.3.apk
          cp wear/build/outputs/apk/release/wear-release.apk release-assets/OpenBubblesWear-Watch-2.1.3.apk

          if [ -d morphe/build/installable ]; then
            mkdir -p release-assets/phone
            cp morphe/build/installable/openbubbles-wear-patched-base.apk release-assets/phone/
            cp morphe/build/installable/config.arm64_v8a.apk release-assets/phone/
            cp morphe/build/installable/config.en.apk release-assets/phone/
            cp morphe/build/installable/config.mdpi.apk release-assets/phone/
            cp morphe/build/installable/SHA256SUMS release-assets/phone/SHA256SUMS
            cp morphe/build/installable/INSTALL.txt release-assets/phone/INSTALL.txt
            cp morphe/build/libs/openbubbles-wear-patches-1.2.0.mpp release-assets/OpenBubblesWear-Morphe-1.2.0.mpp
          fi

          # Generate combined checksums
          cd release-assets
          find . -type f -not -name 'SHA256SUMS.txt' -exec sha256sum {} \; | sort -k2 > SHA256SUMS.txt
          cd ..

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') && env.HAS_RELEASE_SIGNING == 'true'
        with:
          tag_name: 2.1.3-${{ github.run_number }}
          name: OpenBubbles Wear 2.1.3 (build ${{ github.run_number }})
          prerelease: true
          body: |
            ## OpenBubbles Wear 2.1.3

            Automatic release built from `main`.

            Preserves backend delivery status and failed-attempt labels instead of treating every accepted request as sent. Apple rate limits are unchanged. The reported missing group-message bubble still needs device validation; this release does not claim to fix its root cause.

            ### Install

            **Phone (companion bridge):**
            ```bash
            adb -s PHONE_SERIAL install -r OpenBubblesWear-Phone-2.1.3.apk
            ```

            **Watch (companion app):**
            ```bash
            adb -s WATCH_SERIAL install -r OpenBubblesWear-Watch-2.1.3.apk
            ```

            This is a companion-only update for existing 2.1.2 users: install both APKs with `-r` and the same signing key. Keep OpenBubbles and Morphe patch 1.2.0 installed as they are; no replacement or repatch is needed. Do not uninstall.

            See [docs/INSTALL-2.1.3.md](https://github.com/MrCool-888/OB-wearos/blob/main/docs/INSTALL-2.1.3.md) for full instructions. Users on a patch older than 1.2.0 should use the [2.1.2 full setup guide](https://github.com/MrCool-888/OB-wearos/blob/main/docs/INSTALL-2.1.2.md).

            ### What's included

            - `OpenBubblesWear-Phone-2.1.3.apk` and `OpenBubblesWear-Watch-2.1.3.apk` — companion update
            - `phone/` — unchanged patched OpenBubbles 2.0.0 ARM64 APK set, when built
            - `OpenBubblesWear-Morphe-1.2.0.mpp` — unchanged Morphe patch bundle
            - `SHA256SUMS.txt` — checksums for all assets
          files: |
            release-assets/*
            release-assets/**/*
