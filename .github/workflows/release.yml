name: Build and Release OpenBubbles Wear

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Restore signing configuration
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_PROPERTIES" ]; then
            printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties
          fi
          if [ -n "$RELEASE_KEYSTORE" ]; then
            printf '%s' "$RELEASE_KEYSTORE" | base64 -d > release.keystore
          fi

      - name: Run tests
        run: ./gradlew :protocol:test :phone:testDebugUnitTest :wear:testDebugUnitTest

      - name: Build release APKs
        run: ./gradlew :phone:assembleRelease :wear:assembleRelease

      - name: Build Morphe patch and installable APK set
        env:
          MORPHE_JAVA: ${{ secrets.MORPHE_JAVA_PATH }}
          WORK_BASE_APK: ${{ secrets.WORK_BASE_APK }}
          WORK_ARM64_SPLIT: ${{ secrets.WORK_ARM64_SPLIT }}
          WORK_XAPK: ${{ secrets.WORK_XAPK }}
          WORK_CLASSES_V52: ${{ secrets.WORK_CLASSES_V52 }}
        run: |
          if [ -z "$WORK_BASE_APK" ] || [ -z "$WORK_ARM64_SPLIT" ] || [ -z "$WORK_XAPK" ]; then
            echo "Skipping Morphe patch: WORK_BASE_APK, WORK_ARM64_SPLIT, and WORK_XAPK secrets are required."
            exit 0
          fi

          # Restore local OpenBubbles 2.0.0 inputs (gitignored, not in repo)
          mkdir -p work
          printf '%s' "$WORK_BASE_APK" | base64 -d > work/com.openbubbles.messaging.apk
          printf '%s' "$WORK_ARM64_SPLIT" | base64 -d > work/config.arm64_v8a.apk
          printf '%s' "$WORK_XAPK" | base64 -d > OpenBubbles_2.0.0_APKPure.xapk

          if [ -n "$WORK_CLASSES_V52" ]; then
            printf '%s' "$WORK_CLASSES_V52" | base64 -d > work/openbubbles-classes-v52.jar
          fi

          # JDK 21+ is required for the Morphe Desktop CLI launcher
          MORPHE_JAVA_DIR="${MORPHE_JAVA:-/usr/lib/jvm/temurin-21-jdk-amd64}"
          if [ ! -d "$MORPHE_JAVA_DIR" ]; then
            echo "Installing JDK 21 for Morphe CLI..."
            sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-21-jdk-headless >/dev/null 2>&1
            MORPHE_JAVA_DIR="/usr/lib/jvm/java-21-openjdk-amd64"
          fi

          ./gradlew -p morphe packageInstallableApks verifyInstallableApks -PmorpheJava="$MORPHE_JAVA_DIR"

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp phone/build/outputs/apk/release/phone-release.apk release-assets/OpenBubblesWear-Phone-2.1.1.apk
          cp wear/build/outputs/apk/release/wear-release.apk release-assets/OpenBubblesWear-Watch-2.1.1.apk

          if [ -d morphe/build/installable ]; then
            mkdir -p release-assets/phone
            cp morphe/build/installable/openbubbles-wear-patched-base.apk release-assets/phone/
            cp morphe/build/installable/config.arm64_v8a.apk release-assets/phone/
            cp morphe/build/installable/config.en.apk release-assets/phone/
            cp morphe/build/installable/config.mdpi.apk release-assets/phone/
            cp morphe/build/installable/SHA256SUMS release-assets/phone/SHA256SUMS
            cp morphe/build/installable/INSTALL.txt release-assets/phone/INSTALL.txt
            cp morphe/build/libs/openbubbles-wear-patches-1.1.0.mpp release-assets/OpenBubblesWear-Morphe-1.1.0.mpp
          fi

          # Generate combined checksums
          cd release-assets
          find . -type f -not -name 'SHA256SUMS.txt' -exec sha256sum {} \; | sort -k2 > SHA256SUMS.txt
          cd ..

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: 2.1.1-${{ github.run_number }}
          name: OpenBubbles Wear 2.1.1 (build ${{ github.run_number }})
          body: |
            ## OpenBubbles Wear 2.1.1

            Automatic release built from `main`.

            ### Install

            **Phone (companion bridge):**
            ```bash
            adb -s PHONE_SERIAL install -r OpenBubblesWear-Phone-2.1.1.apk
            ```

            **Watch (companion app):**
            ```bash
            adb -s WATCH_SERIAL install -r OpenBubblesWear-Watch-2.1.1.apk
            ```

            **Patched OpenBubbles 2.0.0 (optional, for direct bridge features):**
            Install all four APKs together:
            ```bash
            adb -s PHONE_SERIAL install-multiple -r \
              phone/openbubbles-wear-patched-base.apk \
              phone/config.arm64_v8a.apk \
              phone/config.en.apk \
              phone/config.mdpi.apk
            ```

            See [docs/INSTALL-2.1.1.md](https://github.com/MrCool-888/OB-wearos/blob/main/docs/INSTALL-2.1.1.md) for full installation instructions and important warnings about signing keys and data loss when replacing stock OpenBubbles.

            ### What's included

            - `OpenBubblesWear-Phone-2.1.1.apk` — Wear bridge companion for phone
            - `OpenBubblesWear-Watch-2.1.1.apk` — Wear bridge companion for watch
            - `phone/` — complete patched OpenBubbles 2.0.0 ARM64 APK set (4 files, install together)
            - `OpenBubblesWear-Morphe-1.1.0.mpp` — rebuildable Morphe patch bundle
            - `SHA256SUMS.txt` — checksums for all assets
          files: release-assets/**/*
